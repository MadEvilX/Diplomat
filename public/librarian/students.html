<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студенты | Школьная библиотека</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/librarian.css">
    <link rel="icon" href="/assets/logo.ico" type="image/x-icon">
</head>

<body>
    <header class="librarian-header">
        <div class="container">
            <div class="logo">
                <img src="/assets/logo.png" alt="Логотип школы" height="40">
                <h1>Студенты</h1>
            </div>
            <nav class="librarian-nav">
                <a href="/librarian/books.html">Книги</a>
                <a href="/librarian/students.html" class="active">Студенты</a>
                <button class="librarian-logout-btn" id="logout-btn">Выйти</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="librarian-search-panel">
            <div class="librarian-search-box">
                <input type="text" id="student-search" placeholder="Поиск студентов...">
                <button class="librarian-search-btn" id="student-search-btn">Найти</button>
            </div>
        </div>

        <div class="librarian-table-container">
            <table class="librarian-data-table" id="students-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>Группа</th>
                        <th>Email</th>
                        <th>Книг на руках</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Данные будут загружены через JS -->
                </tbody>
            </table>
        </div>

        <div class="librarian-pagination">
            <button class="librarian-btn" id="prev-page" disabled>Назад</button>
            <span class="librarian-page-info" id="page-info">Страница 1</span>
            <button class="librarian-btn" id="next-page">Вперёд</button>
        </div>
    </main>

    <script src="/js/auth-check.js"></script>
    <script src="/js/librarian-students.js"></script>
</body>

</html>
