<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информация о студенте | Школьная библиотека</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/assets/logo.ico" type="image/x-icon">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="/assets/logo.png" alt="Логотип школы" height="40">
                <h1>Информация о студенте</h1>
            </div>
            <nav class="admin-nav">
                <a href="/admin/dashboard.html">Главная</a>
                <a href="/admin/books.html">Книги</a>
                <a href="/admin/students.html">Студенты</a>
                <a href="/admin/student-detals.html" class="active">Возврат книги</a>
                <button class="logout-btn btn btn-danger" id="logout-btn">Выйти</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <div class="search-panel">
                <div class="search-box">
                    <input type="text" id="student-search" class="form-control" placeholder="Поиск студента по ID...">
                    <button class="btn btn-primary" id="search-student-btn">Найти</button>
                </div>
            </div>
        </div>

        <div class="card student-info">
            <h2 class="student-name" id="student-name">-</h2>
            <div class="student-meta">
                <div><span>Группа:</span> <span id="student-group">-</span></div>
                <div><span>Email:</span> <span id="student-email">-</span></div>
                <div><span>Книг на руках:</span> <span id="student-active-loans">0</span></div>
            </div>
        </div>

        <div class="card">
            <h3>История выдачи книг</h3>
            <div class="table-container">
                <table class="data-table" id="loans-table">
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Автор</th>
                            <th>Дата выдачи</th>
                            <th>Срок возврата</th>
                            <th>Дата возврата</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Книги будут загружены через JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center">
            <a href="/admin/students.html" class="btn btn-secondary" id="back-btn">Назад к списку студентов</a>
        </div>
    </main>

    <script src="/js/auth-check.js"></script>
    <script src="/js/admin-student-detals.js"></script>
</body>

</html>
