<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи | Школьная библиотека</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="/assets/logo.png" alt="Логотип школы" height="40">
                <h1>Управление пользователями</h1>
            </div>
            <nav class="admin-nav">
                <a href="/admin/dashboard.html">Главная</a>
                <a href="/admin/books.html">Книги</a>
                <a href="/admin/students.html">Студенты</a>
                <a href="/admin/users.html" class="active">Пользователи</a>
                <button class="logout-btn" id="logout-btn">Выйти</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="admin-toolbar">
            <button class="btn-primary" id="add-user-btn">Добавить пользователя</button>
            <div class="search-box">
                <input type="text" id="user-search" placeholder="Поиск пользователей...">
                <button id="user-search-btn">Найти</button>
            </div>
        </div>

        <div class="admin-table-container">
            <table class="admin-table" id="users-table">
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Email</th>
                        <th>Роль</th>
                        <th>Дата регистрации</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Пользователи будут загружены через JS -->
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <button id="prev-page" disabled>Назад</button>
            <span id="page-info">Страница 1</span>
            <button id="next-page">Вперёд</button>
        </div>
    </main>

    <!-- Модальное окно добавления/редактирования -->
    <div class="modal" id="user-modal">
        <div class="modal-content">
            <h2 id="modal-title">Добавить пользователя</h2>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label for="user-name">ФИО</label>
                    <input type="text" id="user-name" required>
                </div>
                <div class="form-group">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" required>
                </div>
                <div class="form-group">
                    <label for="user-role">Роль</label>
                    <select id="user-role" required>
                        <option value="librarian">Библиотекарь</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="user-password">Пароль</label>
                    <input type="password" id="user-password" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancel-btn">Отмена</button>
                    <button type="submit" class="btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/auth-check.js"></script>
    <script src="/js/admin-users.js"></script>
</body>

</html>
