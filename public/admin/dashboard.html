<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <style>
        .menu {
            background: #333;
            color: white;
            padding: 10px;
        }

        .menu a {
            color: white;
            margin-right: 15px;
        }
    </style>
</head>

<body>
    <div class="menu">
        <a href="/admin/dashboard.html">Главная</a>
        <a href="/admin/users.html">Пользователи</a>
        <a href="/admin/books.html">Книги</a>
        <a id="logout">Выйти</a>
    </div>

    <h1>Панель управления</h1>

    <script>
        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });
    </script>
</body>

</html>
