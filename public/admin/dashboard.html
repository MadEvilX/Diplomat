<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Школьная библиотека</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/assets/logo.ico" type="image/x-icon">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="/assets/logo.png" alt="Логотип школы" height="40">
                <h1>Администратор библиотеки</h1>
            </div>
            <nav class="admin-nav">
                <a href="/admin/dashboard.html" class="active">Главная</a>
                <a href="/admin/books.html">Книги</a>
                <a href="/admin/students.html">Студенты</a>
                <a href="/admin/student-detals.html">Возврат книги</a>
                <button class="logout-btn btn btn-danger" id="logout-btn">Выйти</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="stats-section">
            <h2 class="section-title">Статистика</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-books">0</div>
                    <div class="stat-label">Всего книг</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="available-books">0</div>
                    <div class="stat-label">Доступно</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="total-users">0</div>
                    <div class="stat-label">Студентов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="active-loans">0</div>
                    <div class="stat-label">Выдано книг</div>
                </div>
            </div>
        </section>

        <section class="recent-activity">
            <h2 class="section-title">Последние действия</h2>
            <div class="activity-list" id="activity-list">
                <!-- Активность будет загружена через JS -->
            </div>
        </section>
    </main>

    <script src="/js/auth-check.js"></script>
    <script src="/js/admin-dashboard.js"></script>
</body>

</html>
