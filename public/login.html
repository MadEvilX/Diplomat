<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека - Вход для персонала</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <img src="/assets/library-logo.svg" alt="Логотип библиотеки" class="logo">
            <h1>Система управления библиотекой</h1>
            <p>Вход только для авторизованного персонала</p>
        </div>

        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="email">Служебный email</label>
                <input type="email" id="email" required autocomplete="off" spellcheck="false">
            </div>

            <div class="input-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" aria-label="Показать пароль">👁️</button>
                </div>
            </div>

            <div id="error-message" class="error-message" aria-live="assertive"></div>

            <button type="submit" class="login-button">
                <span class="button-text">Войти</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="security-notice">
            <p>⚠️ Это защищенная система. Несанкционированный доступ запрещен.</p>
            <p>При проблемах со входом обратитесь к системному администратору.</p>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>

</html>
